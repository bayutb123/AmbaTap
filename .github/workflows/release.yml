name: Release

# Membuat GitHub Release berisi APK bertanda tangan saat tag vX.Y.Z di-push.
# Secrets yang dibutuhkan (Settings › Secrets and variables › Actions):
#   KEYSTORE_BASE64    keystore .jks yang di-encode base64
#   KEYSTORE_PASSWORD  password keystore
#   KEY_ALIAS          alias kunci
#   KEY_PASSWORD       password kunci
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi; lihat README bagian Rilis."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        env:
          AMBATAP_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          AMBATAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AMBATAP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AMBATAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "AmbaTap-$TAG.apk"
          gh release create "$TAG" "AmbaTap-$TAG.apk" --title "AmbaTap $TAG" --generate-notes
